apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebridge-controller
  namespace: kubebridge-system
  labels:
    app.kubernetes.io/name: kubebridge
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubebridge
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubebridge
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubebridge
      containers:
        - name: kubebridge
          image: ghcr.io/kandakatlachandramouli/kubebridge:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--metrics-bind-address=0.0.0.0:8080"
            - "--health-probe-bind-address=0.0.0.0:8081"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
