apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubebridge
rules:
  - apiGroups:
      - connectors.kubebridge.dev
    resources:
      - connectors
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - connectors.kubebridge.dev
    resources:
      - connectors/status
    verbs:
      - get
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
